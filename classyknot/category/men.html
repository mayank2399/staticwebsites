<!doctype html>
<html lang="en">
<head>


  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ClassyKnot — Premium Clothing</title>
  <meta name="description" content="ClassyKnot — Premium clothing for modern style. Browse men & women collections." />
  <link rel="canonical" href="/" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/styles.css" />
</head>


<body class="page-home">
  <header class="site-header" id="site-header"> </header>

  <main>
    <section class="category-header">
      <div class="container">
        <h1 class="category-title">Men's Collection</h1>
        <p class="category-desc">Explore premium menswear — shirts, t-shirts, jeans, jackets & more.</p>
      </div>
    </section>

    <section class="container products" style="padding-top:20px">
      <div class="grid grid-4 product-grid">
        
        <!-- Product Cards — These will later be dynamic -->
        <article class="product-card">
          <a href="/product/linen-shirt-103">
            <div class="product-media"><img src="../assets/p3.jpg" alt="Linen Shirt"></div>
            <h3 class="product-title">Linen Shirt</h3>
            <div class="product-price">₹2,199</div>
          </a>
        </article>

        <article class="product-card">
          <a href="/product/levis-501-jeans-101">
            <div class="product-media"><img src="../assets/p1.jpg" alt="Blue Jeans"></div>
            <h3 class="product-title">Classic Blue Jeans</h3>
            <div class="product-price">₹2,499</div>
          </a>
        </article>

        <article class="product-card">
          <a href="/product/silk-t-shirt-102">
            <div class="product-media"><img src="../assets/p2.jpg" alt="Silk T-Shirt"></div>
            <h3 class="product-title">Silk T-Shirt</h3>
            <div class="product-price">₹1,799</div>
          </a>
        </article>

        <article class="product-card">
          <a href="/product/men-jacket-105">
            <div class="product-media"><img src="../assets/p5.jpg" alt="Men Jacket"></div>
            <h3 class="product-title">Dark Denim Jacket</h3>
            <div class="product-price">₹3,499</div>
          </a>
        </article>

      </div>
    </section>
  </main>  <footer class="site-footer" id="site-footer">
   
  </footer>
</body>
<script src="../assets/app.js"></script>
</html>
