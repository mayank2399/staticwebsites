<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My LMS Notes</title>

  <!-- Prism -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs/themes/prism-tomorrow.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- TOP NAVBAR -->
<header class="topbar">
  <div class="topbar-left">
    <button id="topMenuBtn" class="hamburger">☰</button>
    <span class="logo">MyLMS</span>
  </div>
</header>

<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <input
  type="text"
  id="searchInput"
  placeholder="Search notes..."
  class="search-box"
/>

    <ul id="notesList"></ul>
  </aside>

  <!-- CONTENT -->
  <main class="content">
    <h1 id="noteTitle">Select a note</h1>
    <div id="meta"></div>
    <article id="noteContent" class="markdown-body"></article>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs/prism.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-java.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-javascript.min.js"></script>

<script src="app.js"></script>
</body>
</html>
