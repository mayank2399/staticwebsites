<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Category — ClassyKnot</title>
  <meta name="description" content="Browse our category." />
  <link rel="canonical" href="/category/" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body class="page-category">
  <!-- Reuse header (copy from index) -->
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">
        <img src="assets/logo.png" alt="ClassyKnot" class="brand-logo" />
      </a>
      <nav class="nav">
        <a href="/" class="nav-item">Home</a>
        <a href="/category/men" class="nav-item">Men</a>
        <a href="/category/women" class="nav-item">Women</a>
      </nav>
      <div class="header-actions">
        <a href="/cart" class="icon-btn">🛒<span class="cart-count">0</span></a>
        <button class="hamburger">☰</button>
      </div>
    </div>
  </header>

  <main class="container">
    <nav class="breadcrumbs"><a href="/">Home</a> › <span>Category Name</span></nav>
    <h1>Category Name</h1>

    <aside class="filters">
      <h3>Filter</h3>
      <div class="filter-group">
        <label>Price</label>
        <select>
          <option>All</option>
          <option>Under ₹1,000</option>
          <option>₹1,000 - ₹3,000</option>
        </select>
      </div>
    </aside>

    <section class="products-list">
      <div class="grid grid-4">
        <!-- repeat product-card from index -->
      </div>

      <nav class="pagination" aria-label="Pagination">
        <a class="page-prev">Prev</a>
        <a class="page-num">1</a>
        <a class="page-num">2</a>
        <a class="page-next">Next</a>
      </nav>
    </section>
  </main>

  <footer class="site-footer"> <!-- copy footer from index -->
    <div class="container footer-inner">
      <div class="brand-col">
        <img src="assets/logo.png" alt="ClassyKnot" class="brand-logo footer-logo" />
        <p>ClassyKnot — premium clothing crafted with care.</p>
      </div>
      <div class="links-col">
        <h4>Shop</h4>
        <a href="/category/men">Men</a>
        <a href="/category/women">Women</a>
        <a href="/category/new-arrivals">New Arrivals</a>
      </div>
    </div>
    <div class="footer-bottom">
      <div class="container">© <span id="year2"></span> ClassyKnot. All rights reserved.</div>
    </div>
  </footer>

  <script src="assets/app.js"></script>
</body>
</html>
