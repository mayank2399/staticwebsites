<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin – LMS Notes</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs/themes/prism-tomorrow.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <span class="logo">Admin Panel</span>
  </div>
</header>

<div class="admin">
  <!-- LEFT: STRUCTURE -->
  <section class="panel">
    <h3>1️⃣ Topics</h3>
    <select id="topicSelect"></select>
    <input id="newTopic" placeholder="New topic" />
    <button onclick="addTopic()">Add Topic</button>

    <h3>2️⃣ Sub Topics</h3>
    <select id="subTopicSelect"></select>
    <input id="newSubTopic" placeholder="New sub topic" />
    <button onclick="addSubTopic()">Add Sub Topic</button>

    <h3>3️⃣ Titles</h3>
    <select id="titleSelect"></select>
    <input id="newTitle" placeholder="New title" />
    <button onclick="addTitle()">Add / Edit</button>
  </section>

  <!-- RIGHT: EDITOR -->
  <section class="panel editor">
    <h3>✍️ Content (Markdown)</h3>
    <textarea id="contentInput" placeholder="Write markdown here..."></textarea>

    <h3>👀 Live Preview</h3>
    <article id="preview" class="markdown-body"></article>

    <button onclick="saveNote()">💾 Save Note</button>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="admin.js"></script>
</body>
</html>
