<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classy Knot</title>

<style>
:root{
  --black:#000000;
  --white:#ffffff;
  --gray:#9ca3af;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family: "Inter", sans-serif;
  background:var(--white);
  color:var(--black);
}

/* HEADER */
header{
  position:fixed;
  top:0;
  width:100%;
  padding:24px 8%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:transparent;
  z-index:100;
}

header nav a{
  margin-left:28px;
  text-decoration:none;
  color:var(--black);
  font-size:14px;
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  align-items:center;
  padding:0 8%;
}

.hero h1{
  font-size:72px;
  font-weight:300;
  max-width:800px;
  line-height:1.1;
}

/* SECTION */
.section{
  padding:160px 8%;
}

.section h2{
  font-size:42px;
  font-weight:300;
  margin-bottom:40px;
}

/* PRODUCTS (LOOKBOOK STYLE) */
.lookbook{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:80px;
}

.item img{
  width:100%;
  height:520px;
  object-fit:cover;
}

.item p{
  margin-top:14px;
  font-size:14px;
  color:var(--gray);
}

/* STATEMENT */
.statement{
  padding:200px 8%;
  text-align:center;
}

.statement h2{
  font-size:48px;
  font-weight:300;
}

/* FOOTER */
footer{
  padding:80px 8%;
  font-size:14px;
  color:var(--gray);
}
</style>
</head>

<body>

<header>
  <strong>CLASSY KNOT</strong>
  <nav>
    <a href="#">Men</a>
    <a href="#">Women</a>
    <a href="#">Journal</a>
  </nav>
</header>

<section class="hero">
  <h1>
    Clothing that doesn’t ask for attention.<br>
    It earns it.
  </h1>
</section>

<section class="section">
  <h2>Selected Pieces</h2>
  <div class="lookbook">
    <div class="item">
      <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab">
      <p>Classic Shirt · ₹3,499</p>
    </div>
    <div class="item">
      <img src="https://images.unsplash.com/photo-1503341455253-b2e723bb3dbb">
      <p>Tailored Jacket · ₹6,999</p>
    </div>
  </div>
</section>

<section class="statement">
  <h2>
    Designed slowly.<br>
    Worn forever.
  </h2>
</section>

<footer>
  © 2025 Classy Knot
</footer>

</body>
</html>
