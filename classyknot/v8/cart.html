<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cart | StyleStore</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Cart Page Specific Styles */
    .cart-container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .cart-item {
      display: flex;
      align-items: center;
      background: #fff;
      margin-bottom: 15px;
      padding: 15px;
      border-radius: 5px;
    }

    .cart-item img {
      width: 120px;
      height: 150px;
      object-fit: cover;
      margin-right: 20px;
      border-radius: 5px;
    }

    .cart-item-details {
      flex: 1;
    }

    .cart-item-details h3 {
      margin-bottom: 8px;
      font-size: 18px;
    }

    .cart-item-details p {
      font-weight: bold;
      color: #ff3f6c;
    }

    .remove-btn {
      padding: 8px 12px;
      background: #e7335e;
      color: #fff;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }

    .remove-btn:hover {
      background: #ff3f6c;
    }

    .total {
      text-align: right;
      font-size: 20px;
      margin-top: 20px;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .cart-item {
        flex-direction: column;
        align-items: flex-start;
      }

      .cart-item img {
        margin-bottom: 10px;
      }

      .total {
        text-align: left;
      }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
   <nav class="navbar">
        <h1 class="logo">
            <a href="index.html">
                <img src="../assets/logo.png" alt="StyleStore" height="35">
            </a>
        </h1>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="men.html">Men</a></li>
            <li><a href="women.html">Women</a></li>
            <li><a href="kids.html">Kids</a></li>
            <li><a href="cart.html">Cart (<span id="cart-count">0</span>)</a></li>
        </ul>
    </nav>
  <!-- Cart Items -->
  <!-- Cart Items -->
<div class="cart-container" id="cart-container">
  <h2>Your Cart</h2>
</div>

<div class="cart-container">
  <p class="total" id="total-amount">Total: ₹0</p>
</div>


  <!-- Footer -->
  <footer class="footer">
    <div class="footer-container">
      <div class="footer-col">
        <h4>Online Shopping</h4>
        <ul>
          <li>Men</li>
          <li>Women</li>
          <li>Kids</li>
          <li>Footwear</li>
        </ul>
      </div>

      <div class="footer-col">
        <h4>Customer Policies</h4>
        <ul>
          <li>Contact Us</li>
          <li>FAQ</li>
          <li>Privacy Policy</li>
        </ul>
      </div>

      <div class="footer-col">
        <h4>Keep in Touch</h4>
        <p>Instagram | Facebook | Twitter</p>
      </div>
    </div>

    <div class="footer-bottom">
      © 2026 StyleStore. All rights reserved.
    </div>
  </footer>

  <script src="js/cart.js"></script>
</body>
</html>
