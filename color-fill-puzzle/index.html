<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Color Fill Puzzle</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <header>
            <div class="level-info">LEVEL <span id="level-display">1</span></div>
            <div class="moves-info">MOVES <span id="moves-display">0</span></div>
        </header>

        <main id="board-container">
            <div id="grid"></div>
        </main>
        
        <div id="palette">
            <!-- Buttons generated dynamically -->
        </div>
        
        <div id="modal-overlay" class="hidden">
            <div class="modal-content">
                <h2 id="modal-title">GAME OVER</h2>
                <p id="modal-desc">Out of moves!</p>
                <button id="btn-next" class="btn-primary">RESTART</button>
            </div>
        </div>
    </div>

    <script src="js/game.js"></script>
</body>
</html>
