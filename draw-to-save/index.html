<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Draw to Save</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-ui">
        <header>
            <div id="level-display">LEVEL 1</div>
            <div id="ink-bar-container">
                <div id="ink-bar"></div>
            </div>
        </header>

        <!-- Overlays -->
        <div id="overlay-start" class="overlay">
            <div class="overlay-content">
                <h1>DRAW TO SAVE</h1>
                <p>Draw a line to protect the character from hazards!</p>
                <button id="btn-start" class="btn-primary">PLAY</button>
            </div>
        </div>

        <div id="overlay-gameover" class="overlay hidden">
            <div class="overlay-content">
                <h2>OH NO!</h2>
                <p>The character was hit!</p>
                <button id="btn-retry" class="btn-primary">TRY AGAIN</button>
            </div>
        </div>

        <div id="overlay-win" class="overlay hidden">
            <div class="overlay-content">
                <h2 style="color: #2ed573;">SAFE!</h2>
                <p>You saved them!</p>
                <button id="btn-next" class="btn-primary">NEXT LEVEL</button>
            </div>
        </div>
        
        <div id="countdown-text" class="hidden">3</div>
    </div>

    <!-- Matter.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
