<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kakuro Puzzle</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="header-top">
                <h1>Kakuro</h1>
                <div class="timer" id="timer">00:00</div>
            </div>
            <div class="controls">
                <select id="level-select">
                    <!-- Populated via JS -->
                </select>
                <button id="restart-btn" class="btn secondary-btn">Restart</button>
            </div>
        </header>

        <main class="game-area">
            <div id="kakuro-grid" class="grid">
                <!-- Generated by JS -->
            </div>
        </main>

        <div class="keypad-container">
            <div class="keypad">
                <button class="key" data-val="1">1</button>
                <button class="key" data-val="2">2</button>
                <button class="key" data-val="3">3</button>
                <button class="key" data-val="4">4</button>
                <button class="key" data-val="5">5</button>
                <button class="key" data-val="6">6</button>
                <button class="key" data-val="7">7</button>
                <button class="key" data-val="8">8</button>
                <button class="key" data-val="9">9</button>
                <button class="key action-key" data-val="clear">C</button>
            </div>
        </div>
    </div>

    <!-- Win Modal -->
    <div id="win-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Puzzle Solved!</h2>
            <p>Time: <span id="final-time"></span></p>
            <button id="next-btn" class="btn primary-btn">Next Puzzle</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
