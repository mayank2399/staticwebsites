<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KenKen Puzzle</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="header-top">
                <h1>KenKen</h1>
                <div class="timer" id="timer">00:00</div>
            </div>
            <div class="header-controls">
                <select id="size-select">
                    <option value="4">Easy (4x4)</option>
                    <option value="6" selected>Medium (6x6)</option>
                    <option value="9">Hard (9x9)</option>
                </select>
                <div class="btn-group">
                    <button id="check-btn" class="btn outline-btn">Check</button>
                    <button id="hint-btn" class="btn outline-btn">Hint</button>
                    <button id="reset-btn" class="btn secondary-btn">Restart</button>
                </div>
            </div>
        </header>

        <main class="game-area">
            <div id="kenken-grid" class="grid">
                <!-- Generated by JS -->
            </div>
        </main>

        <div class="keypad-container">
            <div class="keypad" id="keypad">
                <!-- Buttons injected by JS based on size -->
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div id="win-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Puzzle Solved!</h2>
            <p>Time: <span id="final-time"></span></p>
            <button id="next-btn" class="btn primary-btn">New Puzzle</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
