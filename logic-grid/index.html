<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Logic Grid Puzzle</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Logic Grid Puzzle</h1>
            <div class="header-actions">
                <button id="theme-toggle" class="icon-btn" aria-label="Toggle Theme">
                    <svg id="moon-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
                    <svg id="sun-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
                </button>
            </div>
        </header>

        <main class="game-content">
            <section class="clues-section">
                <h2>Clues</h2>
                <p class="subtitle">Click a clue to cross it out when you're done with it.</p>
                <ul id="clues-list">
                    <!-- Clues injected by JS -->
                </ul>
                <div class="controls">
                    <button id="hint-btn" class="btn secondary-btn">Use Hint</button>
                    <button id="check-btn" class="btn primary-btn">Check Solution</button>
                    <button id="reset-btn" class="btn outline-btn">Reset Grid</button>
                </div>
            </section>

            <section class="grid-section">
                <div class="grid-scroll-container">
                    <div id="logic-grid" class="logic-grid">
                        <!-- Grid injected by JS -->
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Modals -->
    <div id="result-modal" class="modal hidden">
        <div class="modal-content">
            <h2 id="modal-title">Result</h2>
            <p id="modal-message"></p>
            <button id="close-modal-btn" class="btn primary-btn">Continue</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
