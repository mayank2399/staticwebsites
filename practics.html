<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rubik Cube World Timer</title>
  <style>
    :root {
      --bg: #121212;
      --text: #ffffff;
      --primary: #fcd34d;
      --accent: #2563eb;
    }
    body.light {
      --bg: #f3f4f6;
      --text: #1f2937;
      --primary: #d97706;
      --accent: #1d4ed8;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      transition: all 0.3s ease;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .logo span {
      color: var(--primary);
    }

    nav a {
      margin: 0 10px;
      text-decoration: none;
      color: var(--text);
    }

    nav a.active {
      color: var(--primary);
    }

    #modeToggle {
      padding: 6px 12px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .timer-display {
      font-size: 80px;
      font-family: monospace;
      text-align: center;
      margin: 30px 0 10px;
      color: var(--primary);
    }

    .timer-buttons button,
    .penalty-buttons button,
    .generate,
    .export-btn button {
      margin: 5px;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    .start { background-color: #22c55e; color: white; }
    .stop  { background-color: #ef4444; color: white; }
    .reset { background-color: #6b7280; color: white; }
    .generate, .export-btn button { background-color: var(--accent); color: white; }

    .penalty-buttons button {
      background-color: #f87171;
    }

    .scramble-section {
      margin: 20px 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
    }

    .scramble-header {
      flex: 1;
      min-width: 250px;
    }

    .scramble {
      font-family: monospace;
      font-size: 20px;
    }

    .cube-img img {
      width: 80px;
    }

    .options, .averages {
      margin: 10px auto;
      text-align: center;
    }

    .averages p {
      color: var(--primary);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    table th, table td {
      padding: 10px;
      border: 1px solid #333;
      text-align: center;
    }

    @media screen and (max-width: 768px) {
      header {
        flex-direction: column;
        align-items: flex-start;
      }

      .scramble-section {
        flex-direction: column;
        text-align: center;
      }

      .averages {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">🧩 Rubik Cube <span>World</span></div>
    <nav>
      <a href="#">Home</a>
      <a href="#">Patterns</a>
      <a href="#" class="active">Timer</a>
    </nav>
    <button id="modeToggle">🌙 Dark Mode</button>
  </header>

  <main>
    <div id="timer" class="timer-display">00.00</div>
    <div class="timer-buttons">
      <button onclick="startTimer()" class="start">Start</button>
      <button onclick="stopTimer()" class="stop">Stop</button>
      <button onclick="resetTimer()" class="reset">Reset</button>
    </div>
    <div class="penalty-buttons">
      <button onclick="addPenalty('+2')">+2</button>
      <button onclick="addPenalty('DNF')">DNF</button>
    </div>
    <div class="options">
      <label>Inspection 
        <select id="inspection">
          <option value="15">15 s</option>
          <option value="0">0 s</option>
        </select>
      </label>
      <label><input type="checkbox" id="showScramble" checked> Show scramble</label>
      <label><input type="checkbox" id="hideTime"> Hide time</label>
    </div>

    <div id="scrambleSection" class="scramble-section">
      <div class="scramble-header">
        <p><strong>Scramble (3x3):</strong></p>
        <p id="scramble" class="scramble"></p>
        <button onclick="generateScramble()" class="generate">Generate New Scramble</button>
      </div>
      <div class="cube-img">
        <img src="https://upload.wikimedia.org/wikipedia/commons/e/e0/Rubik%27s_Cube.svg" alt="Cube"/>
      </div>
    </div>

    <div class="averages">
      <p><strong>Avg of 5:</strong> <span id="avg5">-</span></p>
      <p><strong>Avg of 12:</strong> <span id="avg12">-</span></p>
    </div>

    <div class="export-btn">
      <button onclick="exportToCSV()">⬇️ Export CSV</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Time</th>
          <th>Scramble</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody id="historyTable"></tbody>
    </table>
  </main>

  <script>
    let startTime, interval, isRunning = false;
    let times = JSON.parse(localStorage.getItem("solves")) || [];
    let solves = JSON.parse(localStorage.getItem("solveData")) || [];

    const scrambleMoves = ["R", "R'", "R2", "U", "U'", "U2", "L", "L'", "L2", "F", "F'", "F2", "D", "D'", "D2", "B", "B'", "B2"];

    function formatTime(ms) {
      return (ms / 1000).toFixed(2);
    }

    function updateTimer() {
      const elapsed = Date.now() - startTime;
      document.getElementById("timer").textContent = formatTime(elapsed);
    }

    function startTimer() {
      if (isRunning) return;
      const hideTime = document.getElementById("hideTime").checked;
      if (hideTime) document.getElementById("timer").style.visibility = "hidden";

      const inspection = parseInt(document.getElementById("inspection").value);
      if (inspection > 0) {
        let count = inspection;
        document.getElementById("timer").textContent = `Inspection: ${count}`;
        const countdown = setInterval(() => {
          count--;
          document.getElementById("timer").textContent = `Inspection: ${count}`;
          if (count <= 0) {
            clearInterval(countdown);
            actuallyStart();
          }
        }, 1000);
      } else {
        actuallyStart();
      }
    }

    function actuallyStart() {
      startTime = Date.now();
      interval = setInterval(updateTimer, 10);
      isRunning = true;
      document.getElementById("timer").style.visibility = "visible";
    }

    function stopTimer() {
      if (!isRunning) return;
      clearInterval(interval);
      isRunning = false;
      const elapsed = Date.now() - startTime;
      const time = formatTime(elapsed);
      const scramble = document.getElementById("scramble").textContent;
      const date = new Date().toLocaleDateString("en-IN");
      document.getElementById("timer").textContent = time;
      saveToHistory(time, scramble, date);
    }

    function resetTimer() {
      clearInterval(interval);
      isRunning = false;
      document.getElementById("timer").textContent = "00.00";
    }

    function generateScramble() {
      let scramble = "", last = "";
      for (let i = 0; i < 20; i++) {
        let move;
        do {
          move = scrambleMoves[Math.floor(Math.random() * scrambleMoves.length)];
        } while (move[0] === last);
        scramble += move + " ";
        last = move[0];
      }
      document.getElementById("scramble").textContent = scramble.trim();
    }

    function saveToHistory(time, scramble, date) {
      times.push(parseFloat(time));
      solves.push({ time, scramble, date });
      localStorage.setItem("solves", JSON.stringify(times));
      localStorage.setItem("solveData", JSON.stringify(solves));
      renderHistory();
      updateAverages();
    }

    function renderHistory() {
      const table = document.getElementById("historyTable");
      table.innerHTML = "";
      solves.slice().reverse().forEach(entry => {
        const row = document.createElement("tr");
        row.innerHTML = `<td>${entry.time}</td><td>${entry.scramble}</td><td>${entry.date}</td>`;
        table.appendChild(row);
      });
    }

    function calculateAverage(n) {
      const validTimes = times.filter(t => typeof t === "number");
      if (validTimes.length < n) return "-";
      const recent = validTimes.slice(-n);
      const sum = recent.reduce((a, b) => a + b, 0);
      return (sum / n).toFixed(2);
    }

    function updateAverages() {
      document.getElementById("avg5").textContent = calculateAverage(5);
      document.getElementById("avg12").textContent = calculateAverage(12);
    }

    function exportToCSV() {
      let csv = "Time,Scramble,Date\n";
      solves.forEach(entry => {
        csv += `"${entry.time}","${entry.scramble}","${entry.date}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "rubik_timer_solves.csv";
      a.click();
    }

    function addPenalty(type) {
      if (!solves.length) return;
      let last = solves[solves.length - 1];
      if (type === "+2" && !isNaN(last.time)) {
        last.time = (parseFloat(last.time) + 2).toFixed(2);
      } else if (type === "DNF") {
        last.time = "DNF";
      }
      localStorage.setItem("solveData", JSON.stringify(solves));
      renderHistory();
      updateAverages();
    }

    document.getElementById("modeToggle").onclick = () => {
      document.body.classList.toggle("light");
      document.getElementById("modeToggle").textContent =
        document.body.classList.contains("light") ? "🌙 Dark Mode" : "☀️ Light Mode";
    };

    document.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        isRunning ? stopTimer() : startTimer();
      }
    });

    window.onload = () => {
      generateScramble();
      renderHistory();
      updateAverages();

      document.getElementById("showScramble").onchange = (e) => {
        document.getElementById("scrambleSection").style.display = e.target.checked ? "flex" : "none";
      };

      document.getElementById("hideTime").onchange = (e) => {
        if (!isRunning) {
          document.getElementById("timer").style.visibility = e.target.checked ? "hidden" : "visible";
        }
      };
    };
  </script>
</body>
</html>
