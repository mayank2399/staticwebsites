<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Developer Background Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      background-color: black;
      overflow: hidden;
      color: white;
      font-family: monospace;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .binary-stream {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }

    .binary-stream span {
      position: absolute;
      color: #1DCD9F;
      font-size: 20px;
      animation: fall 5s linear infinite;
      user-select: none;
      white-space: nowrap;
      opacity: 0.1;
    }

    @keyframes fall {
      0% {
        transform: translateY(-100%);
        opacity: 0;
      }
      50% {
        opacity: 0.7;
      }
      100% {
        transform: translateY(100vh);
        opacity: 0;
      }
    }

    .center-text {
      z-index: 1;
      font-size: 2rem;
      text-align: center;
      text-shadow: 0 0 10px #1DCD9F;
    }
  </style>
</head>
<body>
  <div class="binary-stream" id="stream"></div>|
  <div class="center-text">Building with Code 💻</div>

  <script>
   
  </script>
</body>
</html>
