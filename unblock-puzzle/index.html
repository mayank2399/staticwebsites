<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Unblock Puzzle</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Unblock Puzzle</h1>
            <div class="level-selector">
                <label for="level-select">Level:</label>
                <select id="level-select">
                    <!-- Populated by JS -->
                </select>
            </div>
        </header>

        <div class="stats-bar">
            <div class="stat-box">
                <span class="stat-label">Moves</span>
                <span id="move-count" class="stat-value">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Best</span>
                <span id="best-score" class="stat-value">-</span>
            </div>
        </div>

        <main class="game-area">
            <div id="board" class="board">
                <!-- Grid background and Blocks injected by JS -->
                <div id="exit-marker" class="exit-marker"></div>
            </div>
        </main>

        <div class="controls">
            <button id="undo-btn" class="btn secondary-btn" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
                Undo
            </button>
            <button id="restart-btn" class="btn primary-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/></svg>
                Restart
            </button>
        </div>
    </div>

    <!-- Modals -->
    <div id="win-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Level Cleared!</h2>
            <p>You solved it in <span id="final-moves"></span> moves.</p>
            <button id="next-level-btn" class="btn primary-btn">Next Level</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
